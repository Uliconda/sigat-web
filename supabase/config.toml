# Solo se declaran estas propiedades de Auth: `supabase config push` deja el
# resto de la configuración del proyecto como está.
[auth]
# Página a la que vuelven los enlaces de Supabase si no se indica otra.
site_url = "http://localhost:5173"
# Orígenes a los que puede regresar el enlace de "restablecer contraseña".
# Al publicar la web en el servidor, agrega aquí su URL (y en APP_ORIGIN).
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
  "http://192.168.1.246:5173",
  "http://192.168.1.246:5173/**",
]

[functions.manage-users]
verify_jwt = true

# El cron se autentica con x-cron-secret; las sesiones de administrador se
# validan dentro de la función.
[functions.notificaciones-prestamos]
verify_jwt = false

# Pública: la usa quien olvidó su contraseña. Valida origen, límites y, si
# hay sesión de administrador, la verifica dentro de la función.
[functions.recuperar-contrasena]
verify_jwt = false
