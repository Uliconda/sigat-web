name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, build, pruebas y esquema de base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: Pruebas de la web
        run: npm run test:web

      - name: Esquema de Supabase en PostgreSQL (PGlite)
        run: npm run test:db
